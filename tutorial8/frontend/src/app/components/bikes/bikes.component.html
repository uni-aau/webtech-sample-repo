<div class="flex flex-col w-full justify-center items-center">
  <div class="text-2xl font-semibold flex w-auto mb-4">Bikes Overview</div>
  @for (bike of bikes; track bike.bike_id) {
    <div class="w-[90%]">
      <bike-component [bike]="bike" (deleteSuccess)="onBikeDeleted($event)"></bike-component>
    </div>
  }
</div>
